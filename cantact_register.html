<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Contact Form</h1>
    <form border="10" action="" method="get">
        <table border="0">
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Mobile:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td>Country</td>
                <td><Select>
                        <option>India</option>
                        <option>USA</option>
                        <option>Canada</option>
                    </Select></td>
            </tr>
            <tr colspan="2">
                <td><input type="checkbox">Subscribe to Newsletter<br><input type="checkbox">Accept Terms and Conditions
                </td>
            </tr>
            <tr>
                <td><input type="reset" value="Clear"></td>
                <td><input type="submit" value="Register"></td>
            </tr>

        </table>
    </form>

</body>

</html>
