<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 50px;
            background-color: blanchedalmond;
            padding-top: 20px;
        }
        .inner{
           border-radius: 2px;
           border-color: rgb(16, 9, 1);
           padding: 20px;
           text-decoration: none;           
        }
        button:hover{
            background-color: rgb(13, 0, 255);
            color: black;
            transition: 2s;

        }
    </style>
</head>

<body>
    <div class="outer">
        <div>LMS</div>
        <div class="inner">
            <button><a href="">Home</a></button><button><a href="">about</a></button><button><a href="">contact us</a></button>
        </div>
    </div>

</body>

</html>
