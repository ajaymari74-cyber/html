<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h">Activity</h1><br>
    <button type="button" onclick="online()">Online</button>
    <button type="button" onclick="offline()">Offline</button>
    <script>
        function online(){
            document.getElementById("h").style.color="green";
        }
         function offline(){
            document.getElementById("h").style.color="red";
        }
    </script>
</body>
</html>
