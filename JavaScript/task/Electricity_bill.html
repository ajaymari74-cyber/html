<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for=""> Input text:</label>
        <input type="number" id="a1"> <br><br>
        <input type="submit" onclick="f1()">
    </form>
    <script>
        
        function f1(){
        // let unit=Number(prompt("Enter the Unit number:"));
        let unit=document.getElementById("a1").value;
        let amt;
        if (unit<=100){
            amt=unit*2
            document.write("The amount"+amt);
        }
         else if(unit<=300){    
            amt=unit*3
            document.write("The amount is:"+amt);
        }
        else{
            amt=unit*5;
            document.write("The amount is:"+amt);
        }
    }
    </script>
