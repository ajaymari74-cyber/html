<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Eligibility Checker</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      
    
    </style>
</head>
<body>
    
    <div class="form-container">
        <h2>Loan Eligibility</h2>
        <form>
            <label for="sal">Enter Your Salary:</label>
            <input type="number" id="sal"> <br>
            
            <label for="age">Enter Your Age:</label>
            <input type="number" id="age">
            
            <input type="button" value="Check Eligibility" onclick="fun()">
        </form>
        <!-- Corrected class to id for JavaScript targeting -->
        <div id="output">Your loan status will appear here.</div>
    </div>

    <script>
        function fun(){
            // Convert strings to Numbers for clean mathematical comparison
            let salary = Number(document.getElementById("sal").value);
            let age = Number(document.getElementById("age").value);

            // 1. Condition for approval
            if (salary >= 25000 && age >= 21){
                document.getElementById("output").style.color = "white"; // Green
                document.getElementById("output").innerHTML = "Loan Approved!";
            }
            // 2. Condition for underage
            else if (age < 21){
                document.getElementById("output").style.color = "white"; // Red
                document.getElementById("output").innerHTML = "Not Eligible: Age must be 21 or older.";
            }
            // 3. Condition for low salary (Matches your target threshold of 25,000)
            else if (salary < 25000){
                document.getElementById("output").style.color = "white"; // Red
                document.getElementById("output").innerHTML = "Not Eligible: Salary must be 25,000 or higher.";
            }
        }
    </script>
</body>
</html>
