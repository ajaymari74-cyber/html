<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student ID Card Generator</title>

    <style>
      

        .container {
            margin: 40px auto;
            padding: 20px;
            width: 500px;

            background-color: rgba(0, 4, 5, 0.575);

            border: 2px solid red;
            border-radius: 5px;

            color: white;
        }

        h1 {
           text-align: center;
            color: white;
        }

        .form {
            padding: 20px;
        }

        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 10px;
        }

        input,
        select {
            padding: 7px;
            margin-bottom: 10px;
        }

        .submit-btn {
            display: block;
            margin: 10px auto;
            padding: 10px 25px;

            cursor: pointer;
        }

        .id-card {     
             
            margin-top: 20px;
            padding: 20px;

            background-color: white;
            color: black;

            border: 2px solid red;
            border-radius: 10px;
            transition: 2s;
        }
        
    </style>

</head>

<body>

    <div class="container">

        <h1>Student ID Card Generator</h1>

        <form class="form">

            <label>Enter Your Name:</label>

            <input type="text" id="t1">

            <br>

            <label>Select Course:</label>

            <select id="courseSelect">

                <option value="Java Full Stack">
                    Java Full Stack
                </option>

                <option value="Python Full Stack">
                    Python Full Stack
                </option>

                <option value="Data Science">
                    Data Science
                </option>

            </select>

            <br>

            <label>Enter Your Mobile Number:</label>

            <input type="number" id="num">

        </form>

 <input class="submit-btn" type="button" value="Submit" onclick="fun()">
        <div id="h" class="id-card" ></div>

       

    </div>
    

    <script>

        function fun() {

            let name = document.getElementById("t1").value;
            let course = document.getElementById("courseSelect").value;
            let mobilenum = document.getElementById("num").value;
            document.getElementById("h").innerHTML =

                "<h2>Student ID Card</h2>" +

                "Welcome : " + name + "<br><br>" +

                "Your Course : " + course + "<br><br>" +

                "Mobile Number : " + mobilenum;
                
                 document.getElementById("h").style.color="white";
                  document.getElementById("h").style.padding="20px";
                   document.getElementById("h").style.backgroundImage='URL("https://static.vecteezy.com/system/resources/thumbnails/055/264/725/small/red-abstract-background-space-for-banner-brocure-business-card-selling-products-backdrop-wallpaper-background-and-text-illustration-vector.jpg")';


        }

    </script>

</body>

</html>
